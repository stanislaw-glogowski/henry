[project]
name = "henry-app"
version = "0.1.0"
description = "Local, privacy-first voice assistant for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.24.0",
    "langchain-ollama>=1.1.0",
    "langchain>=1.3.14",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph>=1.2.9",
    "loguru>=0.7.3",
    "mlx-audio>=0.4.6",
    "mlx>=0.32.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0,<2",
    "openwakeword==0.6.0",
    "piper-tts>=1.6.0",
    "platformdirs>=4.11.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
henry-cli = "henry_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/henry_cli",
    "src/henry_common",
    "src/henry_conversation",
    "src/henry_resources",
    "src/henry_speech",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=henry_cli",
    "--cov=henry_common",
    "--cov=henry_conversation",
    "--cov=henry_resources",
    "--cov=henry_speech",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]

[tool.coverage.run]
omit = ["*/adapters/*"]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
