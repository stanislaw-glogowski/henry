[project]
name = "henry-app"
version = "0.1.0"
description = "Local, privacy-first voice assistant for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.24.0",
    "loguru>=0.7.3",
    "mlx-audio>=0.4.5",
    "mlx-lm>=0.31.3",
    "mlx>=0.32.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.24.1,<2",
    "openwakeword==0.6.0",
    "piper-tts>=1.5.0",
    "platformdirs>=4.0.0",
    "pyaudio>=0.2.14",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
henry-cli = "henry_cli.main:main"
henry-debugger = "henry_debugger.main:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/henry_cli",
    "src/henry_client",
    "src/henry_common",
    "src/henry_debugger",
    "src/henry_resources",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
