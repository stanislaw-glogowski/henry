# Technical runtime settings. Profile-specific model parameters live in profile.yml.
conversation:
  language_model:
    adapter: "mlx" # options: mlx, langchain
  acknowledgement_delay: 0.5 # seconds before a prepared waiting reaction may play
  classify_ambiguous: false # use the optional classifier model for ambiguous turns

speech:
  audio:
    driver: "avfaudio" # options: avfaudio, pyaudio

  vad:
    adapter: "mlx:silero_vad" # options: mlx:silero_vad, openwakeword
    threshold: 0.5 # scores at or above this value count as speech

  wakeword:
    adapter: "openwakeword"

  segmentation:
    min_start_speech_frames: 10 # consecutive speech frames required to start an utterance
    max_start_silence_frames: 150 # silence frames allowed while waiting for speech
    max_end_silence_frames: 18 # trailing silence frames that end a regular utterance
    short_utterance_speech_frames: 31 # speech frames below which an utterance is short
    short_utterance_end_silence_frames: 28 # trailing silence required for a short utterance
    max_utterance_frames: 1875 # hard limit for all frames in one utterance
    pre_roll_frames: 15 # frames retained from immediately before detected speech

  tts:
    adapter: "piper" # options: piper, mlx:chatterbox
    repo_id: "rhasspy/piper-voices" # Hugging Face repository containing Piper voices
    normalize_audio: true # normalize generated samples before playback
    volume: 1.0 # output gain multiplier

  stt:
    adapter: "mlx:parakeet-tdt" # options: mlx:parakeet-tdt, mlx:qwen3-asr, mlx:whisper
    model_id: "mlx-community/parakeet-tdt-0.6b-v3" # Hugging Face model identifier
