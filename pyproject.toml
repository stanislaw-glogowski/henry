[project]
name = "henry-app"
version = "0.1.0"
description = "Local, privacy-first voice assistant for Apple Silicon Macs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.26.0",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "mlx-audio>=0.4.6",
    "mlx-lm>=0.30.6",
    "mlx>=0.32.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0,<2",
    "openwakeword==0.6.0",
    "piper-tts>=1.6.0",
    "platformdirs>=4.11.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "soxr>=1.0.0",
    "textual>=8.2.8",
]

[project.scripts]
henry-cli = "henry_cli.main:main"

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyrefly>=1.2.0",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260724",
    "types-pyaudio>=0.2.16.20260508",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/henry_cli",
    "src/henry_common",
    "src/henry_conversation",
    "src/henry_resources",
    "src/henry_speech",
]
artifacts = [
    "src/henry_speech/audio/adapters/avfaudio/bin/henry-audio",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/henry_speech/audio/adapters/avfaudio/bin/henry-audio",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=henry_cli",
    "--cov=henry_common",
    "--cov=henry_conversation",
    "--cov=henry_resources",
    "--cov=henry_speech",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]

[tool.coverage.run]
omit = ["*/adapters/*"]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.pyrefly]
check-unannotated-defs = true
infer-return-types = "checked"
preset = "default"
project-includes = ["hatch_build.py", "src"]
python-platform = "darwin"
python-version = "3.14"
replace-imports-with-any = ["mlx.core"]
search-path = ["src"]
use-ignore-files = true

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = []

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC110"]
